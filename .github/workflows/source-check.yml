name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public source index and documentation
        run: python3 tools/check_repository.py
      - name: Check shell syntax
        run: |
          bash -n packaging/test-arm64.sh
          bash -n packaging/publish-github.sh
          bash -n prueba_cpu_arm64.command
      - name: Check Python syntax
        run: python3 -m compileall -q tools
      - name: Check GPU host symbol inventory with native fixtures
        run: python3 -m unittest discover -s tests -p test_gpu_link.py
      - name: Check Vulkan surface requirements
        run: python3 -m unittest discover -s tests -p test_vulkan.py
      - name: Check GPU supervisor without GPU execution
        run: python3 -m unittest discover -s tests -p test_gpu_supervisor.py
      - name: Check submission metadata on the CPU
        run: python3 -m unittest discover -s tests -p test_gpu_submission_trace.py
