name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check component pins and public source boundaries
        run: python3 tools/check_public_source.py
      - name: Check public build and launch scripts
        run: |
          for script in build.sh run.sh tools/build_host.sh tools/build_cpu.sh tools/runtime-settings.sh; do
            bash -n "$script"
          done
      - name: Check Python syntax
        run: python3 -m compileall -q tools
      - name: Check build orchestration and provenance without game data
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
